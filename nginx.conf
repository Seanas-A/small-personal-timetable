server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Les assets sont hashés (index-XXXX.js) : cache long et immuable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html : revalidation à chaque visite (l'ETag rend ça quasi gratuit),
    # pour que chaque redéploiement soit visible sans hard-refresh.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
